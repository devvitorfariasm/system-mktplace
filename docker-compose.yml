# Sobe tudo com um único comando: docker compose up --build
# Valores padrão embutidos para não exigir .env; copie .env.example para .env se quiser alterar.
name: mktplace

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: mktplace-kafka
    ports:
      - "9094:9094"   # listener EXTERNAL para desenvolvimento no host (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Tópicos são criados pelos serviços (NewTopic beans), nunca automaticamente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"     # nó único de demo; o padrão de 1 GB compete com as JVMs dos serviços
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: mktplace-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xmx256m"
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: mktplace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mktplace} -d audit"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: mktplace-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # ---- serviços Java: mesma imagem, um profile por processo ----
  order-service:
    build: .
    image: mktplace-app
    container_name: mktplace-order
    environment:
      SPRING_PROFILES_ACTIVE: order
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_ZONE: ${APP_ZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      AUDIT_URL: http://audit-service:8085
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure     # o chaos "crash" derruba o processo e o compose sobe de novo (rebalance visível)
    mem_limit: 640m         # 5 JVMs na mesma máquina: sem limite cada uma tentaria usar 70% do host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  payment-service:
    build: .
    image: mktplace-app
    container_name: mktplace-payment
    environment:
      SPRING_PROFILES_ACTIVE: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_ZONE: ${APP_ZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure     # o chaos "crash" derruba o processo e o compose sobe de novo (rebalance visível)
    mem_limit: 640m         # 5 JVMs na mesma máquina: sem limite cada uma tentaria usar 70% do host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  inventory-service:
    build: .
    image: mktplace-app
    container_name: mktplace-inventory
    environment:
      SPRING_PROFILES_ACTIVE: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_ZONE: ${APP_ZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure     # o chaos "crash" derruba o processo e o compose sobe de novo (rebalance visível)
    mem_limit: 640m         # 5 JVMs na mesma máquina: sem limite cada uma tentaria usar 70% do host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-service:
    build: .
    image: mktplace-app
    container_name: mktplace-notification
    environment:
      SPRING_PROFILES_ACTIVE: notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_ZONE: ${APP_ZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure     # o chaos "crash" derruba o processo e o compose sobe de novo (rebalance visível)
    mem_limit: 640m         # 5 JVMs na mesma máquina: sem limite cada uma tentaria usar 70% do host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  audit-service:
    build: .
    image: mktplace-app
    container_name: mktplace-audit
    environment:
      SPRING_PROFILES_ACTIVE: audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mktplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktplace}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_ZONE: ${APP_ZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure     # o chaos "crash" derruba o processo e o compose sobe de novo (rebalance visível)
    mem_limit: 640m         # 5 JVMs na mesma máquina: sem limite cada uma tentaria usar 70% do host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-data:
  postgres-data:
