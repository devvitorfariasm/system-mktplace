# Profile "inventory": processo independente, banco "inventory", consumer group "inventory-service-v1".
mktplace:
  service-name: inventory-service
server:
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory
    username: ${POSTGRES_USER:mktplace}
    password: ${POSTGRES_PASSWORD:mktplace}
  flyway:
    locations: classpath:db/commons,classpath:db/migration/inventory
